name: CI

# 每次 push / PR 都跑：引擎全套件 + 文档看门狗（ubuntu）+ Windows 轻量覆盖（Flet 壳 + 引擎稳定子集）。
# 2026-11-01：SwiftUI/Tk 旧壳已冻结、不再发布 → 旧壳 job 下线；Windows 侧改为 Flet 壳测试与
# 引擎稳定子集（full 套件仍由 ubuntu job 覆盖；clean-runner 环境假设红见 B-246c P6 遗留）。
# 设计要点：
#   · 重活验收（全库普查/回归、代表稿）**需要稿件库**，CI 上没有 —— 那些工具会打印一行说明并
#     正常退出（0），所以这里不会因为它们红（见 Engine/slcn/paths.py）；
#   · 需要 TeX / LibreOffice 的用例自带跳过判据，缺就 SKIP，不误报；
#   · 数字一律看 `tools/gen_docs.py --check`（AUTO 块过期就红）。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: 引擎（套件 + 文档看门狗）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: 装依赖
        run: python -m pip install --disable-pip-version-check lxml pypdf pypinyin
      - name: AUTO 块是否过期（独立守卫；CI 无稿件库/out 产物 → 信息性）
        # 第四十一批 O2：full 套件里的 test_docs_consistency 不再重复跑套件（用 --no-test-runs），
        # AUTO 的「测试」计数行就由**本步骤**（独立的 gen_docs --check）承担守卫。
        # ⚠️ CI runner 没有稿件库 / out/ 产物，块里依赖它们的数字无法重现 → 只能信息性；
        #    有稿件库的机器上由发版前 `selfcheck.py --full`（--strict-tests）与显式
        #    `python3.14 tools/gen_docs.py --check` 做严格判定。
        continue-on-error: true
        working-directory: Engine
        run: |
          # B-309：AUTO 块里依赖稿件库/out 产物的数字在 CI runner 上无法重现；显式 SKIP
          # 并退出 0（旧版直接跑 gen_docs --check → 恒 exit 1，只能靠 continue-on-error
          # 压成灰，日志里全是噪声）。本机约定解释器不在 = CI Linux runner，跳过。
          if [ ! -x /opt/homebrew/bin/python3.14 ]; then
            echo "SKIP：没有 /opt/homebrew/bin/python3.14（CI runner）；AUTO 严格守卫留在发版机 selfcheck --full"
            exit 0
          fi
          python tools/gen_docs.py --check
      - name: 文档看门狗
        working-directory: Engine
        run: python tests/test_docs_consistency.py
      - name: 全部套件
        env:
          SLCN_DUMP_RED_LOGS: "1"
          # B-309：ubuntu runner 上 3 路并行（红套件仍会串行复核；汇总行/退出码语义不变）
          SLCN_TEST_JOBS: "3"
          # 解释器必须显式指定（macos 镜像自带 /opt/homebrew/bin/python3.14，但没有 pip 装的依赖）
          SLCN_TEST_PYTHON: python
        run: bash Engine/tools/run_engine_tests.sh full
      - name: 案例索引是否过期（没有笔记仓时自动跳过）
        run: python tools/gen_case_index.py --check

  windows:
    name: Windows：Flet 壳测试 + 引擎稳定子集
    # 2026-11-01 用户拍板：CI 去冗余 —— 删「Swift 测试台 + Windows 外壳桥梁」（旧壳冻结），
    # 换成 Flet 单壳 + Windows 上不依赖 TeX/LibreOffice/稿件库的引擎稳定子集。
    # full 引擎套件仍由上面的 ubuntu job 覆盖；quick 全档在干净 Windows runner 有环境假设红（B-246c P6）。
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: 装依赖
        run: python -m pip install --disable-pip-version-check lxml pypdf pypinyin flet pystray Pillow pytest
      - name: Flet 壳测试
        run: python -m pytest sources-flet/tests -q
      - name: 引擎稳定子集（不依赖 TeX/LibreOffice/稿件库）
        run: |
          cd Engine
          export PYTHONPATH="."
          fails=0
          for t in tests/test_paths.py tests/test_proofcheck.py tests/test_latex_preamble.py tests/test_infocheck_toc.py tests/test_merge_into.py tests/test_bib_protection_forms.py tests/test_mock_keyed_responses.py; do
            echo "== $t"
            if ! python "$t"; then
              echo "::error::$t failed"
              fails=$((fails+1))
            fi
          done
          echo "subset failures: $fails"
          test "$fails" -eq 0
