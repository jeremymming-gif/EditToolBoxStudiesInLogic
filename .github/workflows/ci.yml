name: CI

# 每次 push / PR 都跑：引擎全套件 + 文档看门狗 + Swift 测试台 + 外壳桥梁。
# 设计要点：
#   · 重活验收（全库普查/回归、代表稿）**需要稿件库**，CI 上没有 —— 那些工具会打印一行说明并
#     正常退出（0），所以这里不会因为它们红（见 Engine/slcn/paths.py）；
#   · 需要 TeX / LibreOffice 的用例自带跳过判据，缺就 SKIP，不误报；
#   · 数字一律看 `tools/gen_docs.py --check`（AUTO 块过期就红）。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: 引擎（套件 + 文档看门狗）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 装依赖
        run: python -m pip install --disable-pip-version-check lxml pypdf pypinyin
      - name: AUTO 块是否过期（独立守卫；CI 无稿件库/out 产物 → 信息性）
        # 第四十一批 O2：full 套件里的 test_docs_consistency 不再重复跑套件（用 --no-test-runs），
        # AUTO 的「测试」计数行就由**本步骤**（独立的 gen_docs --check）承担守卫。
        # ⚠️ CI runner 没有稿件库 / out/ 产物，块里依赖它们的数字无法重现 → 只能信息性；
        #    有稿件库的机器上由发版前 `selfcheck.py --full`（--strict-tests）与显式
        #    `python3.14 tools/gen_docs.py --check` 做严格判定。
        continue-on-error: true
        working-directory: Engine
        run: python tools/gen_docs.py --check
      - name: 文档看门狗
        working-directory: Engine
        run: python tests/test_docs_consistency.py
      - name: 全部套件
        env:
          SLCN_DUMP_RED_LOGS: "1"
          # 解释器必须显式指定（macos 镜像自带 /opt/homebrew/bin/python3.14，但没有 pip 装的依赖）
          SLCN_TEST_PYTHON: python
        run: bash Engine/tools/run_engine_tests.sh full
      - name: 案例索引是否过期（没有笔记仓时自动跳过）
        run: python tools/gen_case_index.py --check

  swift:
    name: Swift 测试台 + Windows 外壳桥梁
    # 2026-10-31：macos-14 runner 镜像 2026-11-02 退役；当前有 scheduled macOS 14 brownout
    # （job 0 秒 cancelled，annotation 引用 actions/runner-images#13518）。迁 macos-15：
    # 与 release.yml 的 macOS 构建作业一致（同样因旧 Xcode 对超大 SwiftUI View 类型检查
    # 超时而先迁），避免 brownout 窗口内 CI 无法转绿。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 装依赖
        run: python -m pip install --disable-pip-version-check lxml pypdf pypinyin
      - name: Swift 测试台（6 个）
        run: bash tools/run_swift_tests.sh
      - name: Windows 外壳桥梁测试（不需要 Windows；真窗口那条缺 tkinter 时 SKIP）
        working-directory: sources-win
        run: python tests/test_bridge.py | tail -3
