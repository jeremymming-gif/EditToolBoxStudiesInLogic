# 构建与发布（Flet 单壳 · macOS + Windows）
#
# B-246c P5：产品线已切到 Flet 单壳（sources-flet/）。旧 Tk / SwiftUI 双壳已于批108 删除
# （历史源码见 v1.5.0 tag），不再发布。
#
# 触发：
#   · 打 tag（v1.5.0 这种）→ 跑测试 + 双平台构建 + 建 Release（附 latest.json）
#   · 手动 workflow_dispatch → 只跑测试与构建，**不**建 Release（用来验证打包脚本）
#
# 打包口径与 `.github/workflows/build-flet.yml` 一致（两条流水线共用）：
#   · 引擎 sidecar：Windows 用 `Engine/tools/build_win_sidecar.ps1`（只产 SLCNEngine.exe）；
#                    macOS 用等价 PyInstaller onefile（同一入口表/模板数据）
#   · 应用：`flet pack`（onefile；macOS 出 .app），sidecar 放在可执行文件同目录
#     （macOS 为 `.app/Contents/MacOS/SLCNEngine`）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # 建 Release 需要

env:
  # 版本号只有一处：Engine/slcn/__init__.py 的 __version__（P5 不动它，由发版批次统一改）
  PYTHONUNBUFFERED: "1"
  # Windows: 控制台默认 cp1252，测试脚本打印中文会 UnicodeEncodeError
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"

jobs:
  # ── ① 纯逻辑测试：两个平台各跑一遍（不需要 TeX / LibreOffice / GUI）─────────
  test:
    name: 测试（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: 装依赖（vendor 的等价物 + Flet 壳测试依赖）
        run: python -m pip install --disable-pip-version-check lxml pypdf pypinyin pytest flet

      # ⚠️ Windows 干净 runner 上 quick 档仍有环境假设红（缺 TeX/LibreOffice 的 Windows-only 断言，
      #    B-246c P6 遗留）：引擎套件在 macOS 跑 quick，Windows 侧以 flet pytest + bridge 覆盖，full 由 ubuntu CI 覆盖。
      - name: 引擎套件（quick 档；macOS 跑；Windows 由 flet pytest+bridge 覆盖）
        if: runner.os != 'Windows'
        shell: bash
        env:
          # macos runner 镜像里装着 /opt/homebrew/bin/python3.14（无依赖），必须显式指定
          SLCN_TEST_PYTHON: python
        run: |
          set -o pipefail
          bash Engine/tools/run_engine_tests.sh quick 2>&1 | tee /tmp/quick-engine.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::quick 引擎套件失败 rc=$rc；关键摘要："
            grep -E '.FAIL|汇总|ERROR|Traceback' /tmp/quick-engine.log | head -20 || true
          fi
          exit "$rc"

      - name: Flet 壳单元测试（不启动 GUI）
        run: python -m pytest sources-flet/tests -q

  # ── ② macOS：引擎 sidecar + Flet .app + zip ───────────────────────────────
  macos:
    name: 构建 macOS 应用（Flet）
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: 读取版本号（唯一出处）
        id: ver
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' Engine/slcn/__init__.py | head -1)
          echo "value=${V:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: 装依赖
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check lxml pypdf pypinyin pyinstaller flet pystray Pillow

      - name: 引擎 sidecar（PyInstaller onefile，等价 Tk 版入口表）
        run: |
          set -euo pipefail
          mkdir -p build-flet
          ( cd Engine && python -m PyInstaller --noconfirm --clean --onefile --console \
              --name SLCNEngine \
              --distpath ../build-flet/dist-engine \
              --workpath ../build-flet/work-engine \
              --specpath ../build-flet \
              --hidden-import convert --hidden-import checkbib --hidden-import mergepdf \
              --hidden-import cleantemp --hidden-import compileall --hidden-import proofcheck \
              --hidden-import infocheck --hidden-import toc --hidden-import publish \
              --hidden-import bibdb --hidden-import envcheck --hidden-import diagnose \
              --hidden-import dirpush \
              --add-data "$GITHUB_WORKSPACE/编辑笔记/模板文件:编辑笔记/模板文件" \
              engine_main.py )
          cp build-flet/dist-engine/SLCNEngine build-flet/SLCNEngine
          chmod +x build-flet/SLCNEngine
          ./build-flet/SLCNEngine --version

      - name: flet pack（onefile .app，未签名）
        run: |
          set -euo pipefail
          ( cd build-flet && flet pack ../sources-flet/app/main.py --name 编辑部工具箱 --icon ../sources-flet/packaging/assets/logo.icns --distpath dist --yes )
          ls -la build-flet/dist

      - name: sidecar 定位自检（engine_bridge，不经 GUI）
        run: python sources-flet/packaging/sidecar_check.py build-flet/SLCNEngine --run-help

      # ⚠️ macOS runner 自带 BSD find，不支持 GNU 的 -maxdepth（历史 run 41241488672 即因此失败）。
      #    一律用 ditto/ls 组装，禁止 `find ... -maxdepth`。
      - name: macOS 检查 dist 与 sidecar（BSD find 兼容）
        run: |
          set -euo pipefail
          echo "== build-flet =="
          ls -la build-flet || true
          echo "== build-flet/dist =="
          ls -la build-flet/dist
          test -d build-flet/dist
          test -x build-flet/SLCNEngine

      - name: 组装发布包（.app + Contents/MacOS/SLCNEngine + FIRST-OPEN）
        run: |
          set -euo pipefail
          rm -rf pkg-mac
          mkdir -p pkg-mac
          # 把 flet pack 产物整体搬入（.app 或单二进制都适用）
          ditto build-flet/dist pkg-mac
          APPDIR=$(ls -d pkg-mac/*.app 2>/dev/null | head -1 || true)
          if [ -n "$APPDIR" ]; then
            cp build-flet/SLCNEngine "$APPDIR/Contents/MacOS/SLCNEngine"
            chmod +x "$APPDIR/Contents/MacOS/SLCNEngine"
            ( cd "$APPDIR/Contents/MacOS" && shasum -a 256 SLCNEngine > sha256.txt && cat sha256.txt )
          else
            cp build-flet/SLCNEngine pkg-mac/SLCNEngine
            chmod +x pkg-mac/SLCNEngine
            ( cd pkg-mac && shasum -a 256 SLCNEngine > sha256.txt && cat sha256.txt )
          fi
          # ⚠️ 资产名必须纯 ASCII（GitHub 会删掉文件名里的非 ASCII 字符）；
          #    文件内容仍是中文，只有文件名用 ASCII。说明文字统一放 sources-flet/packaging。
          cp sources-flet/packaging/FIRST-OPEN-macOS.txt pkg-mac/
          ls -la pkg-mac
          ls -la pkg-mac/*/Contents/MacOS 2>/dev/null || true

      - name: 生成发布 zip（macOS，ditto 保留 .app 结构）
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.value }}"
          ZIP="EditToolBox-$V-macOS-arm64.zip"
          ditto -c -k --keepParent pkg-mac "$ZIP"
          ZHASH=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo "zip: $ZIP"
          echo "sha256: $ZHASH"
          printf '### macOS artifact\n\nzip: %s\nsha256: %s\n' "$ZIP" "$ZHASH" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            EditToolBox-*-macOS-arm64.zip
            sources-flet/packaging/FIRST-OPEN-macOS.txt
          if-no-files-found: error

  # ── ③ Windows：引擎 sidecar + Flet exe + zip ──────────────────────────────
  windows:
    name: 构建 Windows 应用（Flet）
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: 读取版本号（唯一出处）
        id: ver
        shell: bash
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' Engine/slcn/__init__.py | head -1)
          if [ -z "$V" ]; then V="0.0.0"; fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Engine 版本：$V"

      - name: 装依赖
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check lxml pypdf pypinyin pyinstaller flet pystray Pillow

      - name: 引擎 sidecar（Engine/tools/build_win_sidecar.ps1，只取 SLCNEngine.exe）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -ExecutionPolicy Bypass -File Engine/tools/build_win_sidecar.ps1
          New-Item -ItemType Directory -Force build-flet | Out-Null
          Copy-Item dist/win-sidecar/dist/SLCNEngine.exe build-flet/SLCNEngine.exe
          & build-flet/SLCNEngine.exe --version | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "sidecar 自检失败（SLCNEngine.exe --version）" }

      - name: flet pack（onefile + 版本资源）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $V = "${{ steps.ver.outputs.value }}"
          New-Item -ItemType Directory -Force build-flet | Out-Null
          Push-Location build-flet
          try {
            flet pack ..\sources-flet\app\main.py --name 编辑部工具箱 `
              --product-name "编辑部工具箱" --product-version "$V" --file-version "$V.0" `
              --company-name "SLCN Toolbox" --copyright "SLCN Toolbox" `
              --icon ..\sources-flet\packaging\assets\logo.ico `
              --distpath dist --yes
            if ($LASTEXITCODE -ne 0) { throw "flet pack 失败（rc=$LASTEXITCODE）" }
          } finally {
            Pop-Location
          }
          Get-ChildItem build-flet/dist | Out-Host

      - name: sidecar 定位自检（engine_bridge，不经 GUI）
        run: python sources-flet/packaging/sidecar_check.py build-flet/SLCNEngine.exe --run-help

      - name: 组装并校验 zip（exe + sidecar + FIRST-OPEN + sha256）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $V = "${{ steps.ver.outputs.value }}"
          $pkg = "pkg-win"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item build-flet/dist/编辑部工具箱.exe $pkg/
          Copy-Item build-flet/SLCNEngine.exe $pkg/
          Copy-Item sources-flet/packaging/FIRST-OPEN-Windows.txt $pkg/
          $lines = Get-ChildItem $pkg -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii "$pkg/sha256.txt"
          Compress-Archive -Path "$pkg/*" -DestinationPath "EditToolBox-$V-Windows-x64.zip" -Force
          $zhash = (Get-FileHash "EditToolBox-$V-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          Write-Host "sha256: $zhash"
          "### Windows artifact" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "sha256: $zhash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            EditToolBox-*-Windows-x64.zip
            sources-flet/packaging/FIRST-OPEN-Windows.txt
          if-no-files-found: error

  # ── ④ 发 Release（只在打 tag 时；workflow_dispatch 不建 Release）──────────
  release:
    name: 建 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: 生成 latest.json（应用启动时比对它，只提示不自动替换）
        run: |
          V="${GITHUB_REF_NAME#v}"
          cat > assets/latest.json <<JSON
          {
            "version": "$V",
            "macos": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/EditToolBox-$V-macOS-arm64.zip",
            "windows": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/EditToolBox-$V-Windows-x64.zip",
            "notes": "见 Release 说明"
          }
          JSON
          ls -la assets
      # ⚠️ 未签名/未公证的后果要**在正文里也照实写**（不能只塞在资产里），且不许说成小问题。
      #    自 v1.5.0 起产品线是 Flet 单壳；旧 Tk/SwiftUI 版冻结、不再发布。
      - name: 写 Release 正文（Flet 单壳口径）
        run: |
          V="${GITHUB_REF_NAME#v}"
          cat > /tmp/notes.raw <<'MD'
          **Flet 单壳版**（v1.5.0 起默认产品线；旧 Tk（Windows）与 SwiftUI（macOS）版已冻结，
          仅保留源码作回退参考，不再发布）。Windows / macOS **免安装**包。

          本版**未做代码签名、未做公证**（编辑部 2026-10-16 定案），首次打开会被系统拦一下
          —— **不是文件坏了，也不是中毒**。

          | 平台 | 会看到什么 | 怎么打开 |
          |---|---|---|
          | macOS | 双击提示「已损坏，无法打开」 | 右键点应用 →「打开」→ 弹窗里再点「打开」；<br>或终端一条命令：`xattr -dr com.apple.quarantine "/Applications/编辑部工具箱.app"` |
          | Windows | 蓝色 SmartScreen「Windows 已保护你的电脑」 | 点「更多信息」→ 再点「**仍要运行**」 |

          **下载哪个**

          - `EditToolBox-@V@-macOS-arm64.zip`（Apple 芯片）＋ 说明 `FIRST-OPEN-macOS.txt`
          - `EditToolBox-@V@-Windows-x64.zip`（内含 `编辑部工具箱.exe` 与引擎 sidecar
            `SLCNEngine.exe`，**必须放在同一个目录**）＋ 说明 `FIRST-OPEN-Windows.txt`
          - `latest.json`：应用启动时比对它，**只提示、不自动替换**

          **运行环境**：「初排转换」编译 PDF 需要系统里有 TeX（`xelatex`/`biber`）；
          合并 PDF、导出原稿 PDF 另外需要 LibreOffice（条件必需：仅合并 / 导出原稿 PDF 需要）。
          macOS 版需要系统自带 `python3`（打包版引擎 sidecar 已内置，不再需要自行安装 Python 依赖）。

          **本版变化（相对 Tk/SwiftUI 版）**

          - 双平台统一为 **Flet 单壳**，界面按「单篇 / 整期 / 引用库 / 设置」重新组织；深浅色跟随、
            界面缩放随屏幕工作区钳制。
          - 新增「整期装配」六步流水线（检查 → 生成目录 → 编译 → 合并 → 清理 → 目录摘要推送），
            可逐步执行、可中途取消（隐藏式终止进程树）。
          - 引用库改为**只读视图**（统计与查库）；写库（入藏 / 待裁决）留到后续版本。
          - 设置页新增**环境检查**（TeX / biber / LibreOffice / 字体 / 磁盘），结果只读展示。
          - 退出语义改为「先落盘再退出」（主题 / 缩放 / 最近路径 / 上次页 / 窗口几何）。

          **如实说明（未验证 / 已知限制）**

          - **系统拖放不可用**：Flet/Flutter 桌面窗口不接收资源管理器拖放（已实测），统一走
            「浏览…」打开的 Windows 原生对话框。
          - **IME 候选窗**：中文输入本身可用（已实测），但候选窗位置/跟随未做自动化验证，需人工确认。
          - **onefile 冷启动偏慢**：首次启动约 4.4–4.6s（第二次约 2.4s），体积约 75–85MiB。
          - **未签名 / 未公证**：见上表；macOS 首次打开必须右键→打开或 `xattr` 去隔离。
          - **macOS 侧仅 CI 验证**：本机为 Windows，mac 构建/运行由 CI macos runner 验证，
            未做人工真机走查。
          - **Windows 平台覆盖有限**：真机冒烟按发版前执行；Linux 不在发布范围。
          - TeX/LibreOffice 属条件依赖：未安装时编译/合并/导出功能降级并给出可读错误，其余功能可用。

          MD
          sed "s/@V@/$V/g" /tmp/notes.raw > /tmp/notes.md
          cat /tmp/notes.md
      - name: 建 Release 并附上资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ⚠️ 只把**文件**交给 gh：artifact 合并后可能带目录。用 while read 而不是 mapfile
          #    （本机 bash 3.2 没有 mapfile；CI 上是 5，但脚本要两边都能跑）。
          FILES=()
          while IFS= read -r f; do FILES+=("$f"); done <<< "$(find assets -type f | sort)"
          echo "将要上传 ${#FILES[@]} 个资产："
          printf '  %s\n' "${FILES[@]}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "编辑部工具箱 ${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            "${FILES[@]}"
