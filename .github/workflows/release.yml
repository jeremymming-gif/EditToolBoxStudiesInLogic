name: 构建与发布（macOS + Windows）

# 触发：
#   · 打 tag（v1.0.1 这种）→ 跑测试 + 双平台构建 + 建 Release（附 latest.json）
#   · 手动 workflow_dispatch → 只跑测试与构建，**不**建 Release（用来验证打包脚本）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # 建 Release 需要

env:
  # 版本号只有一处：Engine/slcn/__init__.py 的 __version__
  PYTHONUNBUFFERED: "1"
  # Windows: 控制台默认 cp1252，测试脚本打印中文会 UnicodeEncodeError
  PYTHONIOENCODING: "utf-8"

jobs:
  # ── ① 纯逻辑测试：两个平台各跑一遍（不需要 TeX / LibreOffice）────────────
  test:
    name: 测试（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖（vendor 的等价物）
        run: python -m pip install --disable-pip-version-check lxml pypdf pypinyin

      # ⚠️ 只跑**不依赖稿件库**的套件：本仓（公开的工具仓）里没有作者稿件，
      #    依赖真实稿件的断言都自带 SKIP（见各套件里的 `缺真实稿件` 分支）。
      #    全库回归（corpus.py / docx_audit.py）留在稿件仓里跑，它们要 132 份源稿。
      #
      # ⚠️ 这里**不写行内循环**，而是复用 `Engine/tools/run_engine_tests.sh`（唯一一份逻辑）：
      #    旧写法 `python "$f" | tail -3` 有两处致命伤（案例第 102 条）——
      #      ① `tail -3` 把每套的 stdout 砍到最后 3 行，且管道要等进程结束才吐，
      #         套件打印的诊断（`[DIAG] …`）**一次都没进过 CI 日志**；
      #      ② `set -e` + GitHub 默认的 pipefail 在第一套红时就退出 ——
      #         排在 test_llm_finish_reason 之后的 17 套在 Windows 上**从来没跑过**。
      #    改后：40 套全跑完，红的套件连完整日志一起贴出来（SLCN_DUMP_RED_LOGS=1）。
      - name: 引擎套件（不依赖稿件库的部分）
        shell: bash
        env:
          SLCN_DUMP_RED_LOGS: "1"
          # ⚠️ 必须显式指定解释器：脚本的本机约定是 /opt/homebrew/bin/python3.14，
          #    而 macos-14 的 runner 镜像里**真的装着**它 —— 但它没有下面 pip 装的依赖
          #    （2026-10-16 实测：不指定 → macos 作业 19 套件全红）。这里用 setup-python 的。
          SLCN_TEST_PYTHON: python
        run: bash Engine/tools/run_engine_tests.sh full

      - name: Windows 外壳（桥梁）测试
        shell: bash
        run: |
          cd sources-win
          PYTHONPATH="$PWD/../Engine/vendor" python tests/test_bridge.py | tail -4

  # ── ② macOS：构建 .app 并打包 ────────────────────────────────────────────
  macos:
    name: 构建 macOS 应用
    needs: test
    # 2026-10-20：macos-14 镜像的旧 Xcode 对超大 SwiftUI View 表达式类型检查超时
    # （ConvertTab.body 已拆分仍偶发）；构建作业改用 macos-15（较新 Xcode）。
    # 测试作业仍跑 macos-14，保留旧系统覆盖。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 读取版本号（唯一出处）
        id: ver
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' Engine/slcn/__init__.py | head -1)
          echo "version=${V:-0.0.0}" >> "$GITHUB_OUTPUT"
      - name: 构建 .app
        run: ./build.sh
      - name: 打包（zip 保留可执行位与签名）
        run: |
          cd dist
          zip -qry "EditToolBox-${{ steps.ver.outputs.version }}-macOS-arm64.zip" "编辑部工具箱.app"
      # ⚠️ 未签名/未公证：下载后会撞 Gatekeeper（「已损坏」）。这是 2026-10-15 的决定
      #    （不买 Apple Developer 账号），所以资产里附一份说明，正文里也写清处理方法。
      # ⚠️ 资产名必须**纯 ASCII**：GitHub 会把文件名里的非 ASCII 字符**直接删掉** ——
      #    `首次打开（macOS）.txt` 上传后就成了 `macOS.txt`（2026-10-17 发 v1.0.1 时实测）。
      #    文件**内容**照旧是中文，只有**文件名**用 ASCII。
      - name: 附一份「首次打开」说明
        run: |
          cat > "FIRST-OPEN-macOS.txt" <<'TXT'
          《编辑部工具箱》macOS 版首次打开说明
          ------------------------------------------------
          本应用**未做 Apple 签名与公证**（编辑部决定不购买开发者账号），
          从网上下载后直接双击会被 Gatekeeper 拦下，提示「已损坏，无法打开」。
          这不是文件坏了，是系统隔离标记造成的。处理方法（二选一）：

            方法一（推荐）：右键点应用 → 选「打开」→ 在弹窗里再点「打开」。
            方法二（终端一条命令）：
                xattr -dr com.apple.quarantine "/Applications/编辑部工具箱.app"

          另外：本应用需要系统里有 python3 与 TeX（xelatex/biber）；
          合并 PDF、导出原稿 PDF 另外需要 LibreOffice（可选）。
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            dist/EditToolBox-*.zip
            FIRST-OPEN-macOS.txt

  # ── ③ Windows：冻结引擎 + 界面，打成一个发布目录 ─────────────────────────
  windows:
    name: 构建 Windows 应用
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 打包（引擎 exe + 界面 exe）
        shell: pwsh
        run: ./sources-win/build-win.ps1
      - name: 组装发布目录
        shell: pwsh
        run: |
          $V = (Select-String -Path Engine\slcn\__init__.py -Pattern '^__version__ = "(.*)"').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item sources-win\build\dist\SLCNEngine.exe dist\
          Copy-Item "sources-win\build\dist\编辑部工具箱.exe" dist\
          Compress-Archive -Path dist\SLCNEngine.exe, "dist\编辑部工具箱.exe" `
                           -DestinationPath "EditToolBox-$V-Windows-x64.zip" -Force
      # ⚠️ RELEASING.md 第 155 行：**资产里必须照实说明**「首次打开」这一步，不许说成小问题。
      #    未签名 exe 会撞 SmartScreen（蓝色「Windows 已保护你的电脑」），
      #    而编辑部已定案不做代码签名（R9）—— 所以只能把处理方法写清楚（与 mac 那份对称）。
      - name: 附一份「首次打开」说明
        shell: pwsh
        run: |
          $TXT = @'
          《编辑部工具箱》Windows 版首次打开说明
          ------------------------------------------------
          本程序**未做代码签名**（编辑部决定不购买代码签名证书），
          从网上下载后双击会被 SmartScreen 拦下，出现蓝色提示
          「Windows 已保护你的电脑」。这不是文件坏了，也不是中毒。

            处理方法：点「更多信息」→ 再点「仍要运行」。

          另外两点：
            · 本包是**免安装**的：解压后两个 exe 必须放在**同一个目录**里
              （「编辑部工具箱.exe」启动时会在自己旁边找 SLCNEngine.exe）。
            · 用「初排转换」编译 PDF 需要系统里有 TeX（xelatex/biber）；
              合并 PDF、导出原稿 PDF 另外需要 LibreOffice（可选）。
          '@
          Set-Content -Path "FIRST-OPEN-Windows.txt" -Value $TXT -Encoding UTF8
          Get-Item "FIRST-OPEN-Windows.txt" | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            EditToolBox-*-Windows-x64.zip
            FIRST-OPEN-Windows.txt

  # ── ④ 发 Release（只在打 tag 时）────────────────────────────────────────
  release:
    name: 建 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: 生成 latest.json（外壳启动时比对它，只提示不自动替换）
        run: |
          V="${GITHUB_REF_NAME#v}"
          cat > assets/latest.json <<JSON
          {
            "version": "$V",
            "macos": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/EditToolBox-$V-macOS-arm64.zip",
            "windows": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/EditToolBox-$V-Windows-x64.zip",
            "notes": "见 Release 说明"
          }
          JSON
          ls -la assets
      # ⚠️ RELEASING.md：未签名/未公证的后果要**在正文里也照实写**（不能只塞在资产里），
      #    且不许说成小问题。`--notes` 是**前置**到自动生成的提交清单之前的（见 `gh release create -h`）。
      - name: 写 Release 正文（首次打开的两种处理办法必须写在正文里）
        run: |
          V="${GITHUB_REF_NAME#v}"
          cat > /tmp/notes.raw <<'MD'
          Windows / macOS **免安装**包。本版**未做代码签名、未做公证**（编辑部 2026-10-16 定案），
          首次打开会被系统拦一下 —— **不是文件坏了，也不是中毒**。

          | 平台 | 会看到什么 | 怎么打开 |
          |---|---|---|
          | macOS | 双击提示「已损坏，无法打开」 | 右键点应用 →「打开」→ 弹窗里再点「打开」；<br>或终端一条命令：`xattr -dr com.apple.quarantine "/Applications/编辑部工具箱.app"` |
          | Windows | 蓝色 SmartScreen「Windows 已保护你的电脑」 | 点「更多信息」→ 再点「**仍要运行**」 |

          **下载哪个**

          - `EditToolBox-@V@-macOS-arm64.zip`（Apple 芯片）＋ 说明 `FIRST-OPEN-macOS.txt`
          - `EditToolBox-@V@-Windows-x64.zip`（内含两个 exe，**必须放在同一个目录**）＋ 说明 `FIRST-OPEN-Windows.txt`
          - `latest.json`：应用启动时比对它，**只提示、不自动替换**

          **运行环境**：「初排转换」编译 PDF 需要系统里有 TeX（`xelatex`/`biber`）；
          合并 PDF、导出原稿 PDF 另外需要 LibreOffice（可选）。

          **本版改动（v1.3.0 之后）**

          - **「生成目录」一键最终交付**：缺 `000` 目录自动创建 → 生成 → 落位固定名 → `xelatex×2` → 给出结果路径；生成 tex 固定 `fontset=windows` 并前置检查字体；中文目录对齐人工版，英文目录单页+自动行距压缩（有上限）。
          - **「目录摘要推送」新页**：选当期文件夹（只读）生成目录摘要 `.docx`（期头/目录/专栏/文章摘要，中英对照可选），可生成年度总目录；版式与编辑部实例逐项一致，只交 docx。
          - **删除「本期出刊」页（行为变化）**：两壳只保留「合并文件」页作为唯一合并入口；`publish.py` 五步向导保留为 **CLI 专用**（GUI 不再绑定）；不再产出固定名 `合并.pdf`（保留时间戳输出）。
          - **Word 通道识别补强**：引导语+裸编号引用（「参见文献[4]」）自动转 `\parencite`；英文期刊/英文章节/学位论文/URL 字段；Word 题注并入 `\caption`；英文稿多作者、一作单位/作者信息；引用库默认回填（只补缺失字段）。
          - **模板 × 引擎打通（模板 v11）**：定理/引理等环境、三线表、公式编号、中图分类号/文献标识码、图题表题；模板自转换验收全绿（0 error、零【未识别/需补充】）。
          - **初排交接单**：每次初排自动输出 `<稿>_初排交接单.txt`（bibcheck 结论/未识别元数据/占位符/源稿问题），`--no-handoff` 可关；`.tex/.bib` 逐字节不变。
          - **引用库与外部 bib**：入藏页「外部 bib → 规范 bib」预览/复制/送入入藏；真实库 lint 长期 e0。
          - **90 期初排转换修复**：引号题名尾标点、无引号题名续接、多作者、期刊析出、短引库命中、脚注引用折入 quotation 等；90 期 10 案例全链 0 失败、两遍确定性 100%。
          - **文稿与公开仓**：投稿说明页改为作者口径（去内部工具信息）；公开仓夹具/示例中的真实稿件标题与作者换合成数据（不影响功能与产物）。
          - **工程**：`docxsource.py` 模块化拆分（零行为变化）、目录交付链单点实现、验收工具链（产品内容 hash / 初排交接单）。

          **如实说明（未验证 / 已知限制）**

          - **Windows**：本阶段仍未真机实测（本版 Windows 壳仅同步删除「本期出刊」页，CI 覆盖打包/桥接）；构建照旧出包。
          - **通道② 直连 API**：真实端点未实测（开发期零付费；请自备端点验证）。
          - **「本期出刊」GUI 页已删除**：如需五步整期向导，请用 CLI `publish.py`（CLI-only）。
          - **目录生成/目录摘要推送**：依赖系统 TeX 与 Windows 字体（SimSun/SimHei/KaiTi）；字体缺失会前置报错而非静默替换。
          - **已知解析边界（转人工）**：90-06 有 4 条源稿缺条目的短引仍保留脚注转人工（不编造）；多作品混合脚注合并为一条；88-02 部分 mixed 条目保留人工核对。
          - **元数据人工填写限制**：作者上限 5（模板槽位）；每位作者每语言单位建议 ≤3；EN 模板无关键词槽（英文关键词仅提示人工放置）；CN 模板英文摘要页多单位第二行不缩进（可人工微调）。
          - **GUI 窗口级点击**：受屏幕锁定限制，以源码/断言/二进制/真实 PDF 等价证据验收；真窗口手点待可交互时补。
          MD
          sed "s/@V@/$V/g" /tmp/notes.raw > /tmp/notes.md
          cat /tmp/notes.md
      - name: 建 Release 并附上资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ⚠️ 只把**文件**交给 gh：artifact 合并后可能带目录（`assets/*` 会把目录当资产传，直接报错），
          #    而这一步**只在打 tag 时跑**、没法用 workflow_dispatch 预演 —— 所以写成不依赖目录布局的形式。
          #    用 `while read` 而不是 `mapfile`：本机 bash 3.2 没有 mapfile（CI 上是 5，但脚本要两边都能跑）。
          FILES=()
          while IFS= read -r f; do FILES+=("$f"); done <<< "$(find assets -type f | sort)"
          echo "将要上传 ${#FILES[@]} 个资产："
          printf '  %s\n' "${FILES[@]}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "编辑部工具箱 ${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            "${FILES[@]}"
